name: Keep backend awake (fallback — primary is pg_cron on Supabase)

# NOTE: The primary keep-alive is a pg_cron job in the Supabase database
# (`cron.schedule('leap-keep-alive', '*/10 * * * *', ...)` calling
# net.http_get on the health endpoint). It runs 24/7 with no external
# dependencies and is not subject to this repo's GitHub Actions billing.
#
# This workflow is a redundant fallback. It will not run while the GitHub
# account has an active billing lock ("The job was not started because your
# account is locked due to a billing issue.") — resolve that on the account
# to re-enable it, or rely on the pg_cron job which is already live.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Leap.ai backend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://leap-ai-backend.onrender.com/api/health || echo "000")
          echo "health check: HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::backend returned HTTP ${code} — check the Render service"
            exit 1
          fi
