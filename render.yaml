# Render Blueprint — Leap.ai backend (Spring Boot, free tier).
# Deploys from the repo via `dockerfilePath`; env values come from Render's
# dashboard/API (never commit secrets here).
services:
  - type: web
    name: leap-ai-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        sync: false
      - key: LEAP_APP_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_LIVE_SECRET
        sync: false
      - key: PAYMENTS_MODE
        value: "off"
