spring.application.name=career-leap-backend
server.port=8080

# --- Persistence -----------------------------------------------------------
# Local/dev default: file-backed H2 so data survives restarts (./data/leapai.mv.db).
# Production: set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to a Postgres instance
# (e.g. SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/leapai).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/leapai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
# Poolers (e.g. Supabase) close idle connections aggressively; keep the pool
# honest so a dropped pooled connection never takes the app down at boot.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Uploads (resume analysis) ----------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Auth ------------------------------------------------------------------
# Signing secret for stateless JWT auth tokens. MUST be set to a long random
# value in production; the dev default below is only for local runs.
leapai.jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef}
# Default 30 days so "remember me" logins stay valid for their advertised
# lifetime (the frontend persists remembered sessions for 30 days).
leapai.jwt.ttl-seconds=${JWT_TTL_SECONDS:2592000}

# --- Email (Gmail SMTP primary; Resend API fallback in EmailService) ---------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
# Base URL used to build the password-reset link (frontend origin).
APP_BASE_URL=${APP_BASE_URL:https://career-leap-ai.vercel.app}
